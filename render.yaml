services:
  - type: web
    name: grantbridge-backend
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: grantbridge-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://grantbridge.vercel.app"
      - key: FRONTEND_URL
        value: "https://grantbridge.vercel.app"
      - key: PAYSTACK_SECRET_KEY
        value: "sk_test_d6952f8816fc458dc306386319da82bca4e20f6a"
      - key: PAYSTACK_PUBLIC_KEY
        value: "pk_test_36637e4b0b7603e563d59c3f4cbd436e9a092079"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "grantbrigdehq@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "GrantBridge <grantbrigdehq@gmail.com>"
      - key: ADMIN_EMAIL
        value: "grantbrigdehq@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: grantbridge-db
    databaseName: grantbridge
    user: grantbridge
    plan: free
